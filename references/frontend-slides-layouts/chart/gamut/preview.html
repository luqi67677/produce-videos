<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamut — chart layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Each band stretches open from its median tick.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes lp-stretch { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline,
.slide.active .lp-reading { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-pole { animation: lp-growY 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; transform-origin: top; }
.slide.active .lp-grow:nth-of-type(1) .lp-tick { animation: lp-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-grow:nth-of-type(2) .lp-tick { animation: lp-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.66s both; }
.slide.active .lp-grow:nth-of-type(3) .lp-tick { animation: lp-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.82s both; }
.slide.active .lp-grow:nth-of-type(4) .lp-tick { animation: lp-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.98s both; }
.slide.active .lp-grow:nth-of-type(1) .lp-band { animation: lp-stretch 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-grow:nth-of-type(2) .lp-band { animation: lp-stretch 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.76s both; }
.slide.active .lp-grow:nth-of-type(3) .lp-band { animation: lp-stretch 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.92s both; }
.slide.active .lp-grow:nth-of-type(4) .lp-band { animation: lp-stretch 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.08s both; }
.slide.active .lp-grow:nth-of-type(1) .lp-lbl { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-grow:nth-of-type(2) .lp-lbl { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.01s both; }
.slide.active .lp-grow:nth-of-type(3) .lp-lbl { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.17s both; }
.slide.active .lp-grow:nth-of-type(4) .lp-lbl { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.33s both; }
.slide.active .lp-pole-label,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.35s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Service Consistency — Four Metro Sites</div>

            <!-- OPTIONAL branding/logo slot: wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Auric</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- headline + reading -->
            <h1 class="lp-headline absolute left-[96px] top-[164px] m-0 max-w-[1400px] font-display text-[60px] font-bold leading-none tracking-[-0.01em]">Same median, different weather</h1>
            <div class="lp-reading absolute left-[96px] top-[242px] font-mono text-[16px] uppercase tracking-[0.14em] text-lp-muted">Response minutes · p5–p95 band with median tick · zero at the pole</div>

            <!-- zero pole -->
            <div class="lp-pole absolute left-[560px] top-[320px] w-px h-[536px] bg-lp-line"></div>
            <div class="lp-pole-label absolute left-[520px] top-[872px] w-[80px] text-center font-mono text-[15px] uppercase tracking-[0.08em] text-lp-muted">0 min</div>

            <!-- rows: 50px per minute from x:560 -->
            <!-- Jakarta: 4–9, median 6 -->
            <div class="lp-grow">
                <div class="lp-lbl absolute right-[1400px] top-[356px] font-display text-[28px] font-bold leading-none">Jakarta</div>
                <div class="lp-band absolute left-[760px] top-[362px] w-[250px] h-[20px] bg-lp-line [transform-origin:40%_50%]"></div>
                <div class="lp-tick absolute left-[857px] top-[354px] w-[6px] h-[36px] bg-lp-fg"></div>
                <div class="lp-lbl">
                    <div class="absolute left-[696px] top-[360px] w-[48px] text-right font-mono text-[17px] text-lp-muted">4</div>
                    <div class="absolute left-[1026px] top-[360px] font-mono text-[17px] text-lp-muted">9</div>
                    <div class="absolute left-[830px] top-[318px] w-[60px] text-center font-mono text-[19px]">6</div>
                </div>
            </div>
            <!-- Bandung: 5–11, median 7 -->
            <div class="lp-grow">
                <div class="lp-lbl absolute right-[1400px] top-[484px] font-display text-[28px] font-bold leading-none">Bandung</div>
                <div class="lp-band absolute left-[810px] top-[490px] w-[300px] h-[20px] bg-lp-line [transform-origin:33%_50%]"></div>
                <div class="lp-tick absolute left-[907px] top-[482px] w-[6px] h-[36px] bg-lp-fg"></div>
                <div class="lp-lbl">
                    <div class="absolute left-[746px] top-[488px] w-[48px] text-right font-mono text-[17px] text-lp-muted">5</div>
                    <div class="absolute left-[1126px] top-[488px] font-mono text-[17px] text-lp-muted">11</div>
                    <div class="absolute left-[880px] top-[446px] w-[60px] text-center font-mono text-[19px]">7</div>
                </div>
            </div>
            <!-- Surabaya: 4–8, median 6 -->
            <div class="lp-grow">
                <div class="lp-lbl absolute right-[1400px] top-[612px] font-display text-[28px] font-bold leading-none">Surabaya</div>
                <div class="lp-band absolute left-[760px] top-[618px] w-[200px] h-[20px] bg-lp-line [transform-origin:50%_50%]"></div>
                <div class="lp-tick absolute left-[857px] top-[610px] w-[6px] h-[36px] bg-lp-fg"></div>
                <div class="lp-lbl">
                    <div class="absolute left-[696px] top-[616px] w-[48px] text-right font-mono text-[17px] text-lp-muted">4</div>
                    <div class="absolute left-[976px] top-[616px] font-mono text-[17px] text-lp-muted">8</div>
                    <div class="absolute left-[830px] top-[574px] w-[60px] text-center font-mono text-[19px]">6</div>
                </div>
            </div>
            <!-- Medan: 6–21, median 9 — the spread IS the problem (accent) -->
            <div class="lp-grow">
                <div class="lp-lbl absolute right-[1400px] top-[740px] font-display text-[28px] font-bold leading-none text-lp-accent">Medan</div>
                <div class="lp-band absolute left-[860px] top-[746px] w-[750px] h-[20px] bg-lp-accent opacity-[0.35] [transform-origin:20%_50%]"></div>
                <div class="lp-tick absolute left-[1007px] top-[738px] w-[6px] h-[36px] bg-lp-accent"></div>
                <div class="lp-lbl">
                    <div class="absolute left-[796px] top-[744px] w-[48px] text-right font-mono text-[17px] text-lp-accent">6</div>
                    <div class="absolute left-[1626px] top-[744px] font-mono text-[17px] text-lp-accent">21</div>
                    <div class="absolute left-[980px] top-[702px] w-[60px] text-center font-mono text-[19px] font-medium text-lp-accent">9</div>
                </div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Dispatch logs, Jan–Jun 2026 — bands are 5th to 95th percentile</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">10 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
