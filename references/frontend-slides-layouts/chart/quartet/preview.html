<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quartet — chart layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Silhouettes grow from their baselines; the accent panel lands last.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline,
.slide.active .lp-reading { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-panel:nth-of-type(1) .lp-phead { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.30s both; }
.slide.active .lp-panel:nth-of-type(2) .lp-phead { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both; }
.slide.active .lp-panel:nth-of-type(3) .lp-phead { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-panel:nth-of-type(4) .lp-phead { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-panel:nth-of-type(1) .lp-area { animation: lp-growUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; transform-origin: bottom; }
.slide.active .lp-panel:nth-of-type(2) .lp-area { animation: lp-growUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.62s both; transform-origin: bottom; }
.slide.active .lp-panel:nth-of-type(3) .lp-area { animation: lp-growUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.74s both; transform-origin: bottom; }
.slide.active .lp-panel:nth-of-type(4) .lp-area { animation: lp-growUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.86s both; transform-origin: bottom; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Alert Volume — Four Metros, Twelve Months</div>

            <!-- OPTIONAL branding/logo slot: wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Vantage</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- headline + reading -->
            <h1 class="lp-headline absolute left-[96px] top-[164px] m-0 max-w-[1400px] font-display text-[60px] font-bold leading-none tracking-[-0.01em]">Four cities, one scale</h1>
            <div class="lp-reading absolute left-[96px] top-[242px] font-mono text-[16px] uppercase tracking-[0.14em] text-lp-muted">Weekly confirmed alerts · same y-scale in every panel · Jul 25 → Jun 26</div>

            <!-- panel 1: Jakarta -->
            <div class="lp-panel absolute left-[96px] top-[330px] w-[816px] h-[250px]">
                <div class="lp-phead">
                    <div class="absolute left-0 top-0 font-display text-[26px] font-bold leading-none">Jakarta</div>
                    <div class="absolute right-0 top-[2px] font-mono text-[22px]">740</div>
                </div>
                <div class="lp-area absolute left-0 top-[64px] w-[816px] h-[170px] bg-lp-faint [clip-path:polygon(0%_82%,10%_78%,20%_75%,30%_71%,40%_66%,50%_60%,60%_54%,70%_48%,80%_40%,90%_32%,100%_26%,100%_100%,0%_100%)]"></div>
                <div class="absolute left-0 top-[234px] w-full h-px bg-lp-line"></div>
            </div>

            <!-- panel 2: Bandung -->
            <div class="lp-panel absolute left-[1008px] top-[330px] w-[816px] h-[250px]">
                <div class="lp-phead">
                    <div class="absolute left-0 top-0 font-display text-[26px] font-bold leading-none">Bandung</div>
                    <div class="absolute right-0 top-[2px] font-mono text-[22px]">690</div>
                </div>
                <div class="lp-area absolute left-0 top-[64px] w-[816px] h-[170px] bg-lp-faint [clip-path:polygon(0%_70%,10%_69%,20%_70%,30%_68%,40%_69%,50%_67%,60%_64%,70%_56%,80%_46%,90%_34%,100%_28%,100%_100%,0%_100%)]"></div>
                <div class="absolute left-0 top-[234px] w-full h-px bg-lp-line"></div>
            </div>

            <!-- panel 3: Surabaya -->
            <div class="lp-panel absolute left-[96px] top-[630px] w-[816px] h-[250px]">
                <div class="lp-phead">
                    <div class="absolute left-0 top-0 font-display text-[26px] font-bold leading-none">Surabaya</div>
                    <div class="absolute right-0 top-[2px] font-mono text-[22px]">610</div>
                </div>
                <div class="lp-area absolute left-0 top-[64px] w-[816px] h-[170px] bg-lp-faint [clip-path:polygon(0%_60%,10%_64%,20%_70%,30%_76%,40%_80%,50%_76%,60%_68%,70%_58%,80%_50%,90%_42%,100%_38%,100%_100%,0%_100%)]"></div>
                <div class="absolute left-0 top-[234px] w-full h-px bg-lp-line"></div>
            </div>

            <!-- panel 4: Medan — the protagonist, in accent -->
            <div class="lp-panel absolute left-[1008px] top-[630px] w-[816px] h-[250px]">
                <div class="lp-phead">
                    <div class="absolute left-0 top-0 font-display text-[26px] font-bold leading-none text-lp-accent">Medan</div>
                    <div class="absolute right-0 top-[2px] font-mono text-[22px] font-medium text-lp-accent">940</div>
                </div>
                <div class="lp-area absolute left-0 top-[64px] w-[816px] h-[170px] bg-lp-accent [clip-path:polygon(0%_90%,10%_88%,20%_85%,30%_80%,40%_72%,50%_62%,60%_50%,70%_38%,80%_26%,90%_14%,100%_4%,100%_100%,0%_100%)]"></div>
                <div class="absolute left-0 top-[234px] w-full h-px bg-lp-line"></div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Control-room logs, Jul 2025 → Jun 2026 — endpoint = last full week</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">07 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
