<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrace — chart layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   The terrace rises left to right as one landform.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-riseS { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-growUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline,
.slide.active .lp-reading { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-baseline { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; transform-origin: left; }
.slide.active .lp-col:nth-of-type(1) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(2) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(3) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(4) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(5) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(6) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(7) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.80s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(8) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(9) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.90s both; transform-origin: bottom; }
.slide.active .lp-col:nth-of-type(10) { animation: lp-growUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; transform-origin: bottom; }
.slide.active .lp-edges { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
.slide.active .lp-modal-count { animation: lp-riseS 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Operator Performance — Verify Latency</div>

            <!-- OPTIONAL branding/logo slot: wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Solstice</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- headline + reading -->
            <h1 class="lp-headline absolute left-[96px] top-[164px] m-0 max-w-[1400px] font-display text-[60px] font-bold leading-none tracking-[-0.01em]">Most alerts verify in under a minute</h1>
            <div class="lp-reading absolute left-[96px] top-[242px] font-mono text-[16px] uppercase tracking-[0.14em] text-lp-muted">Seconds from alert to operator verdict · n = 4,320 alerts, Jun 2026 · zero-based</div>

            <!-- baseline -->
            <div class="lp-baseline absolute left-[96px] right-[96px] top-[820px] h-px bg-lp-line"></div>

            <!-- columns: 168px wide, 4px gaps, from x:100; heights true to counts (scale 8.5px/unit of share) -->
            <div class="lp-col absolute left-[100px] top-[786px] w-[168px] h-[34px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[272px] top-[718px] w-[168px] h-[102px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[444px] top-[599px] w-[168px] h-[221px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[616px] top-[497px] w-[168px] h-[323px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[788px] top-[378px] w-[168px] h-[442px] bg-lp-accent"></div>
            <div class="lp-col absolute left-[960px] top-[531px] w-[168px] h-[289px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[1132px] top-[667px] w-[168px] h-[153px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[1304px] top-[743px] w-[168px] h-[77px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[1476px] top-[777px] w-[168px] h-[43px] bg-lp-fg opacity-30"></div>
            <div class="lp-col absolute left-[1648px] top-[803px] w-[168px] h-[17px] bg-lp-fg opacity-30"></div>

            <!-- modal count (the one printed number) -->
            <div class="lp-modal-count absolute left-[788px] top-[336px] w-[168px] text-center font-mono text-[22px] font-medium text-lp-accent">1,214</div>

            <!-- bin edge labels: every other edge -->
            <div class="lp-edges">
                <div class="absolute left-[70px] top-[844px] w-[60px] text-center font-mono text-[17px] text-lp-muted">0s</div>
                <div class="absolute left-[414px] top-[844px] w-[60px] text-center font-mono text-[17px] text-lp-muted">20</div>
                <div class="absolute left-[758px] top-[844px] w-[60px] text-center font-mono text-[17px] text-lp-muted">40</div>
                <div class="absolute left-[1102px] top-[844px] w-[60px] text-center font-mono text-[17px] text-lp-muted">60</div>
                <div class="absolute left-[1446px] top-[844px] w-[60px] text-center font-mono text-[17px] text-lp-muted">80</div>
                <div class="absolute left-[1786px] top-[844px] w-[60px] text-center font-mono text-[17px] text-lp-muted">100+</div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Control-room event log — equal 10-second bins, final bin open</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">08 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
