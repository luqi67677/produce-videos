<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline — chart layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #55554f;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   Columns grow from the baseline in chronological order;
   the accent column lands last and its value pops with it.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-baseline { animation: lp-growx 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-col.c1 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-col.c2 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.53s both; }
.slide.active .lp-col.c3 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.61s both; }
.slide.active .lp-col.c4 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.69s both; }
.slide.active .lp-col.c5 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.77s both; }
.slide.active .lp-col.c6 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-col.c7 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.93s both; }
.slide.active .lp-col.c8 .lp-col-bar { animation: lp-growy 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.21s both; }
.slide.active .lp-tick.c1 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-tick.c2 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.58s both; }
.slide.active .lp-tick.c3 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.66s both; }
.slide.active .lp-tick.c4 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.74s both; }
.slide.active .lp-tick.c5 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.82s both; }
.slide.active .lp-tick.c6 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.90s both; }
.slide.active .lp-tick.c7 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.98s both; }
.slide.active .lp-tick.c8 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.26s both; }
.slide.active .lp-val-first { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
.slide.active .lp-val-accent { animation: lp-rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.5s both; }
.slide.active .lp-reading,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.6s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- header -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Inference Volume</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">07 / 18</div>
            <h2 class="lp-headline absolute left-[96px] top-[118px] m-0 font-display text-[76px] font-extrabold leading-[1.02] tracking-[-0.02em] uppercase">Eight quarters, <em class="not-italic text-lp-accent">3.8×</em></h2>
            <p class="lp-reading absolute right-[96px] top-[128px] m-0 w-[360px] font-body text-[18px] leading-[1.55] text-lp-muted">Volume compounded every quarter since the edge fleet shipped — the last quarter alone processed more than the first four combined.</p>

            <!-- columns (max = 128M → 580px; heights are TRUE PROPORTIONS from a zero baseline) -->
            <div class="absolute left-[96px] right-[96px] top-[340px] flex h-[580px] items-end justify-between">
                <div class="lp-col c1 relative h-[154px] w-[120px]">
                    <span class="lp-val-first absolute -top-[40px] w-full text-center font-mono text-[18px] tracking-[0.04em] text-lp-muted">34M</span>
                    <div class="lp-col-bar h-full w-full origin-bottom bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div>
                </div>
                <div class="lp-col c2 relative h-[186px] w-[120px]"><div class="lp-col-bar h-full w-full origin-bottom bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                <div class="lp-col c3 relative h-[177px] w-[120px]"><div class="lp-col-bar h-full w-full origin-bottom bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                <div class="lp-col c4 relative h-[236px] w-[120px]"><div class="lp-col-bar h-full w-full origin-bottom bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                <div class="lp-col c5 relative h-[308px] w-[120px]"><div class="lp-col-bar h-full w-full origin-bottom bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                <div class="lp-col c6 relative h-[394px] w-[120px]"><div class="lp-col-bar h-full w-full origin-bottom bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                <div class="lp-col c7 relative h-[435px] w-[120px]"><div class="lp-col-bar h-full w-full origin-bottom bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                <div class="lp-col c8 relative h-[580px] w-[120px]">
                    <span class="lp-val-accent absolute -top-[46px] w-full text-center font-mono text-[24px] font-medium tracking-[0.04em] text-lp-accent">128M</span>
                    <div class="lp-col-bar h-full w-full origin-bottom bg-lp-accent"></div>
                </div>
            </div>

            <!-- baseline + period labels -->
            <div class="lp-baseline absolute left-[96px] right-[96px] top-[920px] h-[2px] origin-left bg-lp-line"></div>
            <div class="absolute left-[96px] right-[96px] top-[938px] flex justify-between">
                <div class="lp-tick c1 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q3 '24</div>
                <div class="lp-tick c2 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q4 '24</div>
                <div class="lp-tick c3 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q1 '25</div>
                <div class="lp-tick c4 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q2 '25</div>
                <div class="lp-tick c5 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q3 '25</div>
                <div class="lp-tick c6 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q4 '25</div>
                <div class="lp-tick c7 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q1 '26</div>
                <div class="lp-tick c8 w-[120px] text-center font-mono text-[13px] uppercase tracking-[0.08em] text-lp-muted">Q2 '26</div>
            </div>

            <!-- footer -->
            <div class="lp-foot-left absolute left-[96px] top-[1008px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Platform telemetry — FY24–FY26</div>
            <div class="lp-foot-right absolute right-[96px] top-[1008px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Northbeam</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
