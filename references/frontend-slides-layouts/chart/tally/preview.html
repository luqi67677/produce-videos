<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tally — chart layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Empty frame first, then the filled squares accumulate by row,
   then the number lands once its squares justify it.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-riseB { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-count { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline,
.slide.active .lp-reading { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-wrow:nth-of-type(1) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.30s both; }
.slide.active .lp-wrow:nth-of-type(2) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.36s both; }
.slide.active .lp-wrow:nth-of-type(3) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both; }
.slide.active .lp-wrow:nth-of-type(4) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.48s both; }
.slide.active .lp-wrow:nth-of-type(5) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.54s both; }
.slide.active .lp-wrow:nth-of-type(6) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-wrow:nth-of-type(7) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.66s both; }
.slide.active .lp-wrow:nth-of-type(8) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.72s both; }
.slide.active .lp-wrow:nth-of-type(9) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both; }
.slide.active .lp-wrow:nth-of-type(10) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.84s both; }
.slide.active .lp-wrow:nth-of-type(1) .lp-cell-on { animation: lp-count 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; }
.slide.active .lp-wrow:nth-of-type(2) .lp-cell-on { animation: lp-count 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both; }
.slide.active .lp-wrow:nth-of-type(3) .lp-cell-on { animation: lp-count 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.86s both; }
.slide.active .lp-wrow:nth-of-type(4) .lp-cell-on { animation: lp-count 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.94s both; }
.slide.active .lp-figure { animation: lp-riseB 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
.slide.active .lp-sentence,
.slide.active .lp-footnote { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.4s both; }
</style>
</head>

<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
