<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascent — chart layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Rope first, then the climb, then today's verdict.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes lp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline,
.slide.active .lp-reading { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-baseline { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; transform-origin: left; }
.slide.active .lp-dates { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-plan-draw { animation: lp-wipe 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; transform-origin: left; }
.slide.active .lp-target { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
.slide.active .lp-area { animation: lp-wipe 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; transform-origin: left; }
.slide.active .lp-endpoint { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.55s both; }
.slide.active .lp-today { animation: lp-growY 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.55s both; transform-origin: top; }
.slide.active .lp-today-tag { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.6s both; }
.slide.active .lp-verdict { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.75s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.8s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Rollout Pace — National Grid, Phase One</div>

            <!-- OPTIONAL branding/logo slot: wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Kestrel</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- headline + reading -->
            <h1 class="lp-headline absolute left-[96px] top-[164px] m-0 max-w-[1400px] font-display text-[60px] font-bold leading-none tracking-[-0.01em]">The road to ten thousand</h1>
            <div class="lp-reading absolute left-[96px] top-[242px] font-mono text-[16px] uppercase tracking-[0.14em] text-lp-muted">Cumulative cameras commissioned · the straight line is the contract trajectory</div>

            <!-- baseline (0) + dates -->
            <div class="lp-baseline absolute left-[460px] top-[850px] w-[1300px] h-px bg-lp-line"></div>
            <div class="lp-dates">
                <div class="absolute left-[460px] top-[874px] font-mono text-[17px] text-lp-muted">JAN 26 · 0</div>
                <div class="absolute left-[1560px] top-[874px] w-[200px] text-right font-mono text-[17px] text-lp-muted">DEC 26</div>
            </div>

            <!-- plan line: (460,850) → (1760,330), drawn inside a rotated container -->
            <div class="absolute left-[460px] top-[849px] w-[1400px] h-[2px] rotate-[-21.8deg] origin-left">
                <div class="lp-plan-draw w-full h-full bg-lp-fg"></div>
            </div>

            <!-- target marker + label -->
            <div class="lp-target">
                <div class="absolute left-[1748px] top-[324px] w-[12px] h-[12px] border-2 border-lp-fg"></div>
                <div class="absolute left-[1460px] top-[292px] w-[280px] text-right font-mono text-[18px]">TARGET 10,000</div>
            </div>

            <!-- actual area: start → today (58% across), straight segments, the accent -->
            <div class="lp-area absolute left-[460px] top-[330px] w-[754px] h-[520px] bg-lp-accent [clip-path:polygon(0%_100%,10%_96.9%,20%_93.1%,30%_88.1%,40%_81.9%,50%_75%,60%_68.1%,70%_61.9%,80%_56.9%,90%_53.1%,100%_51%,100%_100%)]"></div>

            <!-- actual endpoint + value -->
            <div class="lp-endpoint">
                <div class="absolute left-[1206px] top-[587px] w-[16px] h-[16px] bg-lp-accent"></div>
                <div class="absolute left-[1240px] top-[608px] font-mono text-[22px] font-medium text-lp-accent">4,900</div>
            </div>

            <!-- today line + verdict -->
            <div class="lp-today absolute left-[1214px] top-[330px] h-[520px] border-l border-dashed border-lp-line"></div>
            <div class="lp-today-tag absolute left-[1154px] top-[302px] w-[120px] text-center font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Today</div>
            <div class="lp-verdict">
                <div class="absolute left-[1202px] top-[542px] w-[12px] h-[12px] border-2 border-lp-muted"></div>
                <div class="absolute left-[1044px] top-[518px] w-[140px] text-right font-mono text-[20px] text-lp-muted">5,800</div>
                <div class="absolute left-[1240px] top-[556px] font-mono text-[19px]">−900 vs plan</div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Commissioning registry, 09 Jul 2026 — target as contracted, Nov 2025</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">09 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
