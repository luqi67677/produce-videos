<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratio Split — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #7c7c7a;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #a8a8a6;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise-sm 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-before,
.slide.active .lp-before-label { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-arrow { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both; }
.slide.active .lp-arrow-head { animation: lp-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-after { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-after-label { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
.slide.active .lp-delta { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- header -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Latency</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">11 / 14</div>
            <h2 class="lp-headline absolute left-[96px] top-[118px] m-0 font-display text-[72px] font-extrabold leading-[1.02] tracking-[-0.02em] uppercase">P99, two quarters <em class="not-italic text-lp-accent">apart</em></h2>

            <!-- before -->
            <div class="lp-before absolute left-[96px] top-[400px] font-display text-[220px] font-extrabold leading-[0.9] tracking-[-0.03em] text-lp-muted">91ms</div>
            <div class="lp-before-label absolute left-[96px] top-[660px] font-mono text-[15px] uppercase tracking-[0.16em] text-lp-muted">Q1 baseline</div>

            <!-- arrow + delta -->
            <div class="lp-arrow absolute left-[850px] top-[498px] w-[220px] h-[3px] bg-lp-accent origin-left" aria-hidden="true"></div>
            <div class="lp-arrow-head absolute left-[1070px] top-[486px] border-l-[22px] border-l-lp-accent border-t-[14px] border-t-transparent border-b-[14px] border-b-transparent" aria-hidden="true"></div>
            <div class="lp-delta absolute left-[850px] top-[548px] w-[242px] text-center font-mono text-[22px] font-medium tracking-[0.06em] text-lp-accent">−58%</div>

            <!-- after -->
            <div class="lp-after absolute right-[96px] top-[400px] text-right font-display text-[220px] font-extrabold leading-[0.9] tracking-[-0.03em] text-lp-fg">38<span class="text-lp-accent">ms</span></div>
            <div class="lp-after-label absolute right-[96px] top-[660px] text-right font-mono text-[15px] uppercase tracking-[0.16em] text-lp-muted">Q2, after the scheduler rewrite</div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Platform telemetry — FY26</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Northbeam</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
