<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Ledger — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #55554f;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   Bars grow to their true width — the growth is the
   reading moment. The highlighted bar lands last.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-row.r1 .lp-row-label, .slide.active .lp-row.r1 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both; }
.slide.active .lp-row.r1 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-row.r2 .lp-row-label, .slide.active .lp-row.r2 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.54s both; }
.slide.active .lp-row.r2 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.64s both; }
.slide.active .lp-row.r3 .lp-row-label, .slide.active .lp-row.r3 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.68s both; }
.slide.active .lp-row.r3 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both; }
.slide.active .lp-row.r4 .lp-row-label, .slide.active .lp-row.r4 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.92s both; }
.slide.active .lp-row.r4 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.02s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- header -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Engineering Time</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">13 / 14</div>
            <h2 class="lp-headline absolute left-[96px] top-[118px] m-0 font-display text-[84px] font-extrabold leading-[1.02] tracking-[-0.02em] uppercase">Where the hours <em class="not-italic text-lp-accent">went</em></h2>

            <!-- bar rows (max = 1,240 h). Bar widths are TRUE PROPORTIONS of the max value (1240h = 100%).
                 Image variant: 96×96 chips left of labels (placehold.co/192x192), all rows or none. -->
            <div class="absolute left-[96px] right-[96px] top-[400px]">
                <div class="lp-row r1 grid grid-cols-[380px_1fr_180px] items-center h-[130px]">
                    <div class="lp-row-label font-body text-[22px] text-lp-fg">Site rollout</div>
                    <div class="relative h-[20px]"><div class="lp-bar absolute left-0 top-0 bottom-0 w-full origin-left bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                    <div class="lp-row-value text-right font-mono text-[20px] tracking-[0.04em] text-lp-fg">1,240 h</div>
                </div>
                <div class="lp-row r2 grid grid-cols-[380px_1fr_180px] items-center h-[130px]">
                    <div class="lp-row-label font-body text-[22px] text-lp-fg">Edge models</div>
                    <div class="relative h-[20px]"><div class="lp-bar absolute left-0 top-0 bottom-0 w-[61.3%] origin-left bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                    <div class="lp-row-value text-right font-mono text-[20px] tracking-[0.04em] text-lp-fg">760 h</div>
                </div>
                <div class="lp-row r3 grid grid-cols-[380px_1fr_180px] items-center h-[130px]">
                    <div class="lp-row-label font-body text-[22px] text-lp-fg">Console</div>
                    <div class="relative h-[20px]"><div class="lp-bar absolute left-0 top-0 bottom-0 w-[33.9%] origin-left bg-[color-mix(in_srgb,var(--lp-fg-muted)_45%,transparent)]"></div></div>
                    <div class="lp-row-value text-right font-mono text-[20px] tracking-[0.04em] text-lp-fg">420 h</div>
                </div>
                <div class="lp-row r4 grid grid-cols-[380px_1fr_180px] items-center h-[130px]">
                    <div class="lp-row-label font-body text-[22px] text-lp-fg">Incident response</div>
                    <div class="relative h-[20px]"><div class="lp-bar absolute left-0 top-0 bottom-0 w-[9.5%] origin-left bg-lp-accent"></div></div>
                    <div class="lp-row-value text-right font-mono text-[20px] tracking-[0.04em] text-lp-accent font-medium">118 h</div>
                </div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Time tracking — Q2 FY26</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Fathom</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
