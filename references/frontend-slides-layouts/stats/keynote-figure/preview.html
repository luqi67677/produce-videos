<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keynote Figure — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
/* Animated pseudo-element — kept as raw CSS because choreography targets it. */
.lp-rail-entry::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: var(--lp-line);
    transform-origin: left center;
}

@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(64px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-hero { animation: lp-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
.slide.active .lp-hero .lp-unit { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-hero-label { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-reading { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-rail-entry:nth-child(1)::before { animation: lp-wipe 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; }
.slide.active .lp-rail-entry:nth-child(2)::before { animation: lp-wipe 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-rail-entry:nth-child(3)::before { animation: lp-wipe 0.55s cubic-bezier(0.16, 1, 0.3, 1) 1.00s both; }
.slide.active .lp-rail-entry:nth-child(1) > * { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; }
.slide.active .lp-rail-entry:nth-child(2) > * { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-rail-entry:nth-child(3) > * { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 1.00s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Performance</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">09 / 14</div>

            <!-- hero figure -->
            <div class="lp-hero absolute left-[96px] top-[280px] m-0 font-display text-[400px] font-extrabold leading-[0.9] tracking-[-0.03em] text-lp-fg">4.7<span class="lp-unit inline-block text-lp-accent">×</span></div>
            <div class="lp-hero-label absolute left-[96px] top-[680px] font-mono text-[17px] font-medium uppercase tracking-[0.2em] text-lp-muted">Throughput vs. last year</div>
            <p class="lp-reading absolute left-[96px] top-[740px] m-0 max-w-[720px] font-body text-[24px] leading-[1.55] text-lp-muted">Same hardware, same budget — the gain came entirely from the scheduler rewrite and quantized edge models.</p>

            <!-- supporting rail -->
            <div class="absolute left-[1360px] right-[96px] top-[300px]">
                <div class="lp-rail-entry relative pt-[28px] pb-[36px]">
                    <div class="font-display text-[88px] font-bold leading-[1] text-lp-fg">38ms</div>
                    <div class="mt-[12px] font-mono text-[14px] uppercase tracking-[0.16em] text-lp-muted">P99 inference</div>
                </div>
                <div class="lp-rail-entry relative pt-[28px] pb-[36px]">
                    <div class="font-display text-[88px] font-bold leading-[1] text-lp-fg">12</div>
                    <div class="mt-[12px] font-mono text-[14px] uppercase tracking-[0.16em] text-lp-muted">Regions live</div>
                </div>
                <div class="lp-rail-entry relative pt-[28px] pb-[36px]">
                    <div class="font-display text-[88px] font-bold leading-[1] text-lp-fg">99.98%</div>
                    <div class="mt-[12px] font-mono text-[14px] uppercase tracking-[0.16em] text-lp-muted">Uptime, trailing 12mo</div>
                </div>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
