<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat Strip — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
/* Animated pseudo-element — kept as raw CSS because choreography targets it. */
.lp-tile::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: var(--lp-line);
    transform-origin: left center;
}

@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-dim { from { opacity: 0; } to { opacity: 0.75; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-tile:nth-child(1)::before { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-tile:nth-child(2)::before { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-tile:nth-child(3)::before { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-tile:nth-child(1) .lp-tile-value { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-tile:nth-child(1) .lp-tile-label { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.53s both; }
.slide.active .lp-tile:nth-child(1) .lp-tile-note  { animation: lp-fade-dim 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.61s both; }
.slide.active .lp-tile:nth-child(2) .lp-tile-value { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-tile:nth-child(2) .lp-tile-label { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.68s both; }
.slide.active .lp-tile:nth-child(2) .lp-tile-note  { animation: lp-fade-dim 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.76s both; }
.slide.active .lp-tile:nth-child(3) .lp-tile-value { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-tile:nth-child(3) .lp-tile-label { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.83s both; }
.slide.active .lp-tile:nth-child(3) .lp-tile-note  { animation: lp-fade-dim 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.91s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- header -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Results</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">10 / 14</div>
            <h2 class="lp-headline absolute left-[96px] top-[118px] m-0 max-w-[1200px] font-display text-[84px] font-extrabold leading-[1.02] tracking-[-0.02em] uppercase">The quarter in <em class="not-italic text-lp-accent">three numbers</em></h2>

            <!-- stat tiles -->
            <div class="absolute left-[96px] right-[96px] top-[460px] grid grid-cols-3 gap-[64px]">
                <div class="lp-tile relative pt-[36px]">
                    <div class="lp-tile-value font-display text-[136px] font-extrabold leading-[0.95] tracking-[-0.02em] text-lp-fg">214</div>
                    <div class="lp-tile-label mt-[24px] font-body text-[22px] leading-[1.4] text-lp-muted">Production deployments</div>
                    <div class="lp-tile-note mt-[20px] font-mono text-[13px] uppercase tracking-[0.14em] text-lp-muted opacity-75">Up 3.1× year over year</div>
                </div>
                <div class="lp-tile relative pt-[36px]">
                    <div class="lp-tile-value font-display text-[136px] font-extrabold leading-[0.95] tracking-[-0.02em] text-lp-fg">38<span class="text-lp-accent">ms</span></div>
                    <div class="lp-tile-label mt-[24px] font-body text-[22px] leading-[1.4] text-lp-muted">P99 inference latency</div>
                    <div class="lp-tile-note mt-[20px] font-mono text-[13px] uppercase tracking-[0.14em] text-lp-muted opacity-75">Down from 91ms</div>
                </div>
                <div class="lp-tile relative pt-[36px]">
                    <div class="lp-tile-value font-display text-[136px] font-extrabold leading-[0.95] tracking-[-0.02em] text-lp-fg">99.98<span class="text-lp-accent">%</span></div>
                    <div class="lp-tile-label mt-[24px] font-body text-[22px] leading-[1.4] text-lp-muted">Platform uptime</div>
                    <div class="lp-tile-note mt-[20px] font-mono text-[13px] uppercase tracking-[0.14em] text-lp-muted opacity-75">Trailing 12 months</div>
                </div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Platform telemetry — Q2 FY26</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[14px] uppercase tracking-[0.12em] text-lp-muted">Kestrel</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
