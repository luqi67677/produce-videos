<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — section layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.25);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-half { from { opacity: 0; } to { opacity: 0.5; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
/* scale-only: opacity stays untouched so dimmed future nodes keep their 0.5 */
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-deck-title,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-part-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-title { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-track { animation: lp-wipe 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-node.n1 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-node.n2 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.83s both; }
.slide.active .lp-node.n3 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.91s both; }
.slide.active .lp-node.n4 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.99s both; }
.slide.active .lp-node.n5 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 1.07s both; }
.slide.active .lp-node-label { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- corner chrome -->
            <div class="lp-deck-title absolute left-[96px] top-[72px] font-mono text-[15px] tracking-[0.12em] uppercase text-lp-muted">Where We Go Next</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] tracking-[0.12em] uppercase text-lp-muted">06 / 14</div>

            <!-- centered title group -->
            <div class="lp-part-kicker absolute left-0 right-0 top-[300px] text-center font-mono text-[16px] font-medium tracking-[0.3em] uppercase text-lp-accent">Part Three of Five</div>
            <h1 class="lp-title absolute left-[96px] right-[96px] top-[380px] m-0 text-center font-display text-[150px] font-extrabold leading-[0.97] tracking-[-0.02em] uppercase">Execution</h1>

            <!-- journey line -->
            <div class="absolute left-0 right-0 top-[700px] mx-auto w-[800px] h-px" aria-label="Part 3 of 5: Execution">
                <div class="lp-track absolute inset-0 bg-lp-line origin-left"></div>
                <span class="lp-node n1 absolute left-0 top-1/2 w-[10px] h-[10px] mt-[-5px] ml-[-5px] rounded-full bg-lp-muted" aria-hidden="true"></span>
                <span class="lp-node n2 absolute left-[25%] top-1/2 w-[10px] h-[10px] mt-[-5px] ml-[-5px] rounded-full bg-lp-muted" aria-hidden="true"></span>
                <span class="lp-node n3 absolute left-[50%] top-1/2 w-[16px] h-[16px] mt-[-8px] ml-[-8px] rounded-full bg-lp-accent" aria-hidden="true"></span>
                <span class="lp-node n4 absolute left-[75%] top-1/2 w-[10px] h-[10px] mt-[-5px] ml-[-5px] rounded-full bg-transparent border border-lp-muted opacity-50" aria-hidden="true"></span>
                <span class="lp-node n5 absolute left-[100%] top-1/2 w-[10px] h-[10px] mt-[-5px] ml-[-5px] rounded-full bg-transparent border border-lp-muted opacity-50" aria-hidden="true"></span>
                <div class="lp-node-label absolute left-1/2 top-[29px] w-[400px] ml-[-200px] text-center font-mono text-[14px] font-medium tracking-[0.18em] uppercase text-lp-accent">Execution</div>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
