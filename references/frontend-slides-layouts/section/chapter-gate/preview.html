<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Gate — section layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #161616;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.09);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-half { from { opacity: 0; } to { opacity: 0.5; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

/* numeral is transform-centered: animate opacity only */
.slide.active .lp-numeral { animation: lp-fade 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
.slide.active .lp-accent-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.47s both; }
.slide.active .lp-framing { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-rail-rule,
.slide.active .lp-rail-item { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-rail-item.is-future { animation-name: lp-fade-half; }
.slide.active .lp-rail-item.is-current .lp-rail-dot { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- kicker -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium tracking-[0.18em] uppercase text-lp-accent">Part Two</div>

            <!-- chapter numeral -->
            <div class="lp-numeral absolute right-[-40px] top-1/2 -translate-y-1/2 font-display text-[640px] font-extrabold leading-[0.8] text-lp-faint pointer-events-none z-0" aria-hidden="true">02</div>

            <!-- title block -->
            <div class="absolute left-[96px] bottom-[300px] max-w-[1150px] z-[1]">
                <div class="lp-accent-bar w-[72px] h-[8px] bg-lp-accent mb-[44px] origin-left"></div>
                <h1 class="lp-title m-0 font-display text-[132px] font-extrabold leading-[0.97] tracking-[-0.02em] uppercase">
                    <span class="lp-line block">Deeper,</span>
                    <span class="lp-line block">not <em class="not-italic text-lp-accent">wider</em></span>
                </h1>
                <p class="lp-framing mt-[36px] mb-0 max-w-[680px] font-body text-[24px] leading-[1.5] text-lp-muted">Why we are concentrating the roadmap on two products instead of five.</p>
            </div>

            <!-- chapter rail -->
            <div class="lp-rail-rule absolute left-[96px] right-[96px] top-[940px] h-px bg-lp-line"></div>
            <div class="absolute left-[96px] top-[966px] flex gap-[64px] font-mono text-[14px] tracking-[0.14em] uppercase text-lp-muted z-[1]">
                <div class="lp-rail-item flex items-center gap-[12px]"><span class="lp-rail-dot w-[8px] h-[8px] rounded-full bg-lp-muted flex-none"></span>01 Inertia</div>
                <div class="lp-rail-item is-current flex items-center gap-[12px] text-lp-accent"><span class="lp-rail-dot w-[8px] h-[8px] rounded-full bg-lp-accent flex-none"></span>02 Depth</div>
                <div class="lp-rail-item is-future flex items-center gap-[12px] opacity-50"><span class="lp-rail-dot w-[8px] h-[8px] rounded-full bg-transparent border border-lp-muted flex-none"></span>03 Execution</div>
                <div class="lp-rail-item is-future flex items-center gap-[12px] opacity-50"><span class="lp-rail-dot w-[8px] h-[8px] rounded-full bg-transparent border border-lp-muted flex-none"></span>04 Proof</div>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
