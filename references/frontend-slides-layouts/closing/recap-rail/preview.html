<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recap Rail — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.12);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.25);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-statement { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-track { animation: lp-wipe 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-node.p1 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; }
.slide.active .lp-node.p2 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.80s both; }
.slide.active .lp-node.p3 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.90s both; }
.slide.active .lp-node.p4 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 1.00s both; }
.slide.active .lp-node.p5 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 1.10s both; }
.slide.active .lp-node-label.p1 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-node-label.p2 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-node-label.p3 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.05s both; }
.slide.active .lp-node-label.p4 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
.slide.active .lp-node-label.p5 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both; }
.slide.active .lp-coda,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">In Closing</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">12 / 12</div>

            <!-- statement -->
            <h1 class="lp-statement absolute left-[96px] top-[150px] m-0 max-w-[1400px] font-display text-[116px] font-extrabold leading-[0.97] tracking-[-0.02em] uppercase">The whole <em class="not-italic text-lp-accent">arc.</em></h1>

            <!-- recap rail.
                 Image variant: past nodes may carry 240×150 thumbnails above the
                 track (https://placehold.co/240x150, object-cover, CSS fill
                 behind). The final ring node never gets one.
                 Edge labels (p1/p5) align inward. -->
            <div class="absolute left-[96px] right-[96px] top-[560px] h-px" aria-label="Deck recap: Inertia, Depth, Execution, Proof, Next">
                <div class="lp-track absolute inset-0 origin-left bg-lp-line"></div>
                <span class="lp-node p1 absolute top-1/2 left-0 w-[12px] h-[12px] mt-[-6px] ml-[-6px] rounded-full bg-lp-muted" aria-hidden="true"></span>
                <span class="lp-node p2 absolute top-1/2 left-1/4 w-[12px] h-[12px] mt-[-6px] ml-[-6px] rounded-full bg-lp-muted" aria-hidden="true"></span>
                <span class="lp-node p3 absolute top-1/2 left-1/2 w-[12px] h-[12px] mt-[-6px] ml-[-6px] rounded-full bg-lp-muted" aria-hidden="true"></span>
                <span class="lp-node p4 absolute top-1/2 left-3/4 w-[12px] h-[12px] mt-[-6px] ml-[-6px] rounded-full bg-lp-muted" aria-hidden="true"></span>
                <span class="lp-node p5 absolute top-1/2 left-full w-[16px] h-[16px] mt-[-8px] ml-[-8px] rounded-full bg-transparent border-[3px] border-lp-accent" aria-hidden="true"></span>
                <div class="lp-node-label p1 absolute top-[27px] left-0 w-auto text-left font-mono text-[14px] uppercase tracking-[0.14em] text-lp-muted">01 Inertia</div>
                <div class="lp-node-label p2 absolute top-[27px] left-1/4 ml-[-120px] w-[240px] text-center font-mono text-[14px] uppercase tracking-[0.14em] text-lp-muted">02 Depth</div>
                <div class="lp-node-label p3 absolute top-[27px] left-1/2 ml-[-120px] w-[240px] text-center font-mono text-[14px] uppercase tracking-[0.14em] text-lp-muted">03 Execution</div>
                <div class="lp-node-label p4 absolute top-[27px] left-3/4 ml-[-120px] w-[240px] text-center font-mono text-[14px] uppercase tracking-[0.14em] text-lp-muted">04 Proof</div>
                <div class="lp-node-label p5 absolute top-[27px] right-0 w-auto text-right font-mono text-[14px] font-medium uppercase tracking-[0.14em] text-lp-accent">Next</div>
            </div>

            <!-- coda -->
            <p class="lp-coda absolute left-[96px] top-[700px] m-0 max-w-[1000px] font-body text-[24px] leading-[1.55] text-lp-muted">Four parts, one thesis: depth compounds. The open ring is Q3 — and it starts Monday.</p>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[940px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[962px] font-mono text-[15px] tracking-[0.08em] text-lp-muted">CONTACT<span class="mx-[14px] text-lp-accent">·</span>solstice.io<span class="mx-[14px] text-lp-accent">·</span>@solstice</div>
            <div class="lp-foot-right absolute right-[96px] top-[962px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Solstice</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
