<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credits Roll — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #141414;
    --lp-fg: #ededeb;
    --lp-fg-muted: #999997;
    --lp-fg-faint: rgba(255, 255, 255, 0.13);
    --lp-accent: #909090;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-xs { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-statement { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-statement .lp-beat { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
/* rows enter in pairs (role+name share a delay) — the roll */
.slide.active .lp-credits > :nth-child(-n+2)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-credits > :nth-child(n+3):nth-child(-n+4)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-credits > :nth-child(n+5):nth-child(-n+6)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; }
.slide.active .lp-credits > :nth-child(n+7):nth-child(-n+8)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.80s both; }
.slide.active .lp-credits > :nth-child(n+9):nth-child(-n+10) { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.90s both; }
.slide.active .lp-contact-line { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">In Closing</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">12 / 12</div>

            <!-- statement -->
            <h1 class="lp-statement absolute left-[96px] right-[96px] top-[170px] m-0 text-center font-display text-[120px] font-extrabold leading-[0.97] tracking-[-0.02em] uppercase">Thank you<span class="lp-beat inline-block text-lp-accent">.</span></h1>

            <!-- credits. Image variant: each row gains a 56×56 photo chip
                 left of the role column (all rows or none). -->
            <div class="lp-credits absolute left-0 right-0 top-[420px] grid grid-cols-[1fr_1fr] gap-x-[48px] gap-y-[30px] justify-center">
                <div class="text-right self-center font-mono text-[15px] uppercase tracking-[0.16em] text-lp-muted">Platform Lead</div><div class="text-left font-display text-[30px] font-bold text-lp-fg">A. Rahman</div>
                <div class="text-right self-center font-mono text-[15px] uppercase tracking-[0.16em] text-lp-muted">Edge Models</div><div class="text-left font-display text-[30px] font-bold text-lp-fg">S. Wijaya</div>
                <div class="text-right self-center font-mono text-[15px] uppercase tracking-[0.16em] text-lp-muted">Unified Console</div><div class="text-left font-display text-[30px] font-bold text-lp-fg">D. Putri</div>
                <div class="text-right self-center font-mono text-[15px] uppercase tracking-[0.16em] text-lp-muted">Site Rollout</div><div class="text-left font-display text-[30px] font-bold text-lp-fg">Field Ops Guild</div>
                <div class="text-right self-center font-mono text-[15px] uppercase tracking-[0.16em] text-lp-muted">Reliability</div><div class="text-left font-display text-[30px] font-bold text-lp-fg">On-call, all of you</div>
            </div>

            <!-- contact line -->
            <div class="lp-contact-line absolute left-0 right-0 top-[940px] text-center font-mono text-[15px] tracking-[0.08em] text-lp-muted">CONTACT<span class="mx-[18px] text-lp-accent">·</span>cinder.io<span class="mx-[18px] text-lp-accent">·</span>@cinder</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
