<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Frame — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   (Dark neutral here to show the tokens are role-based,
   not lightness-based — light systems remap the same tokens.)
   =========================================== */
.slide.lp {
    --lp-bg: #161616;
    --lp-fg: #ededed;
    --lp-fg-muted: #9a9a9a;
    --lp-fg-faint: rgba(255, 255, 255, 0.14);
    --lp-accent: #8f8f8f;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(56px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-drift { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

.slide.active .lp-frame { animation: lp-fade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
.slide.active .lp-ghost { animation: lp-drift 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-statement .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-statement .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.57s both; }
.slide.active .lp-coda { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-cell:nth-child(1) { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-cell:nth-child(2) { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
.slide.active .lp-cell:nth-child(3) { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- frame (skin point: system's border vocabulary, same inset);
                 overflow-hidden clips the ghost echo word — structural -->
            <div class="lp-frame absolute inset-[48px] border border-lp-line overflow-hidden">
                <!-- chrome -->
                <div class="lp-kicker absolute left-[72px] top-[64px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">In Closing</div>
                <div class="lp-counter absolute right-[72px] top-[64px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">12 / 12</div>

                <!-- ghost echo (must bleed past the frame's right edge; clipped by frame) -->
                <div class="lp-ghost absolute right-[-140px] top-[210px] z-0 pointer-events-none font-display font-extrabold text-[380px] leading-[0.85] uppercase text-transparent [-webkit-text-stroke:2px_var(--lp-fg-faint)]" aria-hidden="true">Next</div>

                <!-- closing statement (statement bottom edge ≈ y:690 on stage incl. coda) -->
                <div class="absolute left-[72px] bottom-[232px] z-[1] max-w-[1400px]">
                    <h1 class="lp-statement m-0 font-display text-[176px] font-extrabold leading-[0.95] tracking-[-0.02em] uppercase">
                        <span class="lp-line block">Thank <em class="not-italic text-lp-accent">you.</em></span>
                    </h1>
                    <p class="lp-coda mt-[36px] mb-0 max-w-[760px] font-body text-[24px] leading-[1.5] text-lp-muted">The full report and the roadmap discussed today are linked below — questions welcome anytime.</p>
                </div>

                <!-- contact strip (pinned to frame bottom) -->
                <div class="absolute left-[72px] right-[72px] bottom-[64px] grid grid-cols-3 border-t border-lp-line">
                    <div class="lp-cell pt-[32px]">
                        <div class="mb-[12px] font-mono text-[13px] uppercase tracking-[0.16em] text-lp-muted">Email</div>
                        <div class="font-body text-[24px] text-lp-fg">CONTACT</div>
                    </div>
                    <div class="lp-cell pt-[32px] pl-[48px] border-l border-lp-line">
                        <div class="mb-[12px] font-mono text-[13px] uppercase tracking-[0.16em] text-lp-muted">Site</div>
                        <div class="font-body text-[24px] text-lp-fg">beacon.io</div>
                    </div>
                    <div class="lp-cell pt-[32px] pl-[48px] border-l border-lp-line">
                        <div class="mb-[12px] font-mono text-[13px] uppercase tracking-[0.16em] text-lp-muted">Handle</div>
                        <div class="font-body text-[24px] text-lp-fg">@beacon</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
