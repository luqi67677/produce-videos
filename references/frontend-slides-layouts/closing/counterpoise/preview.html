<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counterpoise — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-statement .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-statement .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
.slide.active .lp-tail { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-entry:nth-child(1) { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-entry:nth-child(2) { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both; }
.slide.active .lp-entry:nth-child(3) { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- kicker + statement -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">In Closing</div>
            <h1 class="lp-statement absolute right-[96px] top-[150px] m-0 max-w-[1200px] text-right font-display text-[128px] font-extrabold leading-[0.97] tracking-[-0.02em] uppercase">
                <span class="lp-line block">See you</span>
                <span class="lp-line block">out <em class="not-italic text-lp-accent">there.</em></span>
            </h1>
            <div class="lp-tail absolute right-[96px] top-[470px] w-[200px] h-px origin-right bg-lp-line" aria-hidden="true"></div>

            <!-- contact stack.
                 Image variant: a bordered 480×360 plate (https://placehold.co/480x360,
                 object-cover, CSS fill behind) anchors the corner; the stack
                 sits on its top edge with a caption line under the plate. -->
            <div class="absolute left-[96px] bottom-[96px] w-[560px]">
                <div class="lp-entry py-[22px]">
                    <div class="mb-[10px] font-mono text-[13px] uppercase tracking-[0.16em] text-lp-muted">Email</div>
                    <div class="font-body text-[26px] text-lp-fg">CONTACT</div>
                </div>
                <div class="lp-entry py-[22px] border-t border-lp-line">
                    <div class="mb-[10px] font-mono text-[13px] uppercase tracking-[0.16em] text-lp-muted">Site</div>
                    <div class="font-body text-[26px] text-lp-fg">beacon.io</div>
                </div>
                <div class="lp-entry py-[22px] border-t border-lp-line">
                    <div class="mb-[10px] font-mono text-[13px] uppercase tracking-[0.16em] text-lp-muted">Handle</div>
                    <div class="font-body text-[26px] text-lp-fg">@beacon</div>
                </div>
            </div>

            <!-- counter -->
            <div class="lp-counter absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">12 / 12</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
