<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settlement — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   The account settles line by line; the double rule closes the books.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-riseS { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-riseT { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-lrow:nth-of-type(1) .lp-rlabel { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
.slide.active .lp-lrow:nth-of-type(2) .lp-rlabel { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.33s both; }
.slide.active .lp-lrow:nth-of-type(3) .lp-rlabel { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.51s both; }
.slide.active .lp-lrow:nth-of-type(1) .lp-rentry { animation: lp-riseS 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.20s both; }
.slide.active .lp-lrow:nth-of-type(2) .lp-rentry { animation: lp-riseS 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.38s both; }
.slide.active .lp-lrow:nth-of-type(3) .lp-rentry { animation: lp-riseS 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.56s both; }
.slide.active .lp-lrow:nth-of-type(1) .lp-rrule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; transform-origin: left; }
.slide.active .lp-lrow:nth-of-type(2) .lp-rrule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.43s both; transform-origin: left; }
.slide.active .lp-lrow:nth-of-type(3) .lp-rrule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.61s both; transform-origin: left; }
.slide.active .lp-double-1 { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; transform-origin: left; }
.slide.active .lp-double-2 { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.83s both; transform-origin: left; }
.slide.active .lp-settle { animation: lp-riseT 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Dossier 26-041 — Close of File</div>

            <!-- OPTIONAL branding/logo slot: wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Vantage</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- ledger rows -->
            <div class="lp-lrow absolute left-[96px] right-[96px] top-[220px] h-[122px]">
                <div class="lp-rlabel absolute left-0 top-[52px] font-mono text-[17px] uppercase tracking-[0.16em] text-lp-muted">Shown</div>
                <div class="lp-rentry absolute right-0 top-[42px] font-display text-[40px] font-bold leading-none">Twelve cities, one federation</div>
                <div class="lp-rrule absolute left-0 right-0 bottom-0 h-px bg-lp-line"></div>
            </div>
            <div class="lp-lrow absolute left-[96px] right-[96px] top-[342px] h-[122px]">
                <div class="lp-rlabel absolute left-0 top-[52px] font-mono text-[17px] uppercase tracking-[0.16em] text-lp-accent">Asked</div>
                <div class="lp-rentry absolute right-0 top-[42px] font-display text-[40px] font-bold leading-none text-lp-accent">Rp 40B — the phase-two budget line</div>
                <div class="lp-rrule absolute left-0 right-0 bottom-0 h-px bg-lp-line"></div>
            </div>
            <div class="lp-lrow absolute left-[96px] right-[96px] top-[464px] h-[122px]">
                <div class="lp-rlabel absolute left-0 top-[52px] font-mono text-[17px] uppercase tracking-[0.16em] text-lp-muted">Unlocked</div>
                <div class="lp-rentry absolute right-0 top-[42px] font-display text-[40px] font-bold leading-none">Eight more cities by December</div>
                <div class="lp-rrule absolute left-0 right-0 bottom-0 h-px bg-lp-line"></div>
            </div>

            <!-- the double rule: the bookkeeper's total mark -->
            <div class="lp-double-1 absolute left-[96px] right-[96px] top-[586px] h-[2px] bg-lp-fg"></div>
            <div class="lp-double-2 absolute left-[96px] right-[96px] top-[594px] h-[2px] bg-lp-fg"></div>

            <!-- the settlement line -->
            <h1 class="lp-settle absolute left-[96px] top-[668px] m-0 max-w-[1600px] font-display text-[96px] font-extrabold leading-[1.02] tracking-[-0.02em]">One vote settles it.</h1>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">CONTACT — decision requested by 16 Jul 2026</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">12 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
