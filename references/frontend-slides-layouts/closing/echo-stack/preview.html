<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Stack — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #141414;
    --lp-fg: #ededeb;
    --lp-fg-muted: #999997;
    --lp-fg-faint: rgba(255, 255, 255, 0.13);
    --lp-accent: #909090;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
/* rows 1–4 fade to their resting opacity (keyframe has no explicit `to`,
   so each row lands on its own nth-child opacity) */
.slide.active .lp-row:nth-child(1) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.20s both; }
.slide.active .lp-row:nth-child(2) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.33s both; }
.slide.active .lp-row:nth-child(3) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.46s both; }
.slide.active .lp-row:nth-child(4) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.59s both; }
.slide.active .lp-row:nth-child(5) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-row .lp-beat { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">In Closing</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">12 / 12</div>

            <!-- echo stack -->
            <div class="absolute left-[96px] top-[160px]" aria-label="Thank you.">
                <span class="lp-row block font-display text-[140px] font-extrabold leading-[1.04] tracking-[-0.02em] text-lp-fg opacity-[0.10]" aria-hidden="true">Thank you</span>
                <span class="lp-row block font-display text-[140px] font-extrabold leading-[1.04] tracking-[-0.02em] text-lp-fg opacity-[0.18]" aria-hidden="true">Thank you</span>
                <span class="lp-row block font-display text-[140px] font-extrabold leading-[1.04] tracking-[-0.02em] text-lp-fg opacity-[0.32]" aria-hidden="true">Thank you</span>
                <span class="lp-row block font-display text-[140px] font-extrabold leading-[1.04] tracking-[-0.02em] text-lp-fg opacity-[0.55]" aria-hidden="true">Thank you</span>
                <span class="lp-row block font-display text-[140px] font-extrabold leading-[1.04] tracking-[-0.02em] text-lp-fg">Thank you<span class="lp-beat inline-block text-lp-accent">.</span></span>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[958px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[982px] font-mono text-[15px] tracking-[0.08em] text-lp-muted">CONTACT <span class="text-lp-accent">·</span> arka.io <span class="text-lp-accent">·</span> @arka</div>
            <div class="lp-foot-right absolute right-[96px] top-[982px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Arka</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
