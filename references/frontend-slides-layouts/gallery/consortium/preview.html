<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consortium — gallery layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipeX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-wipeY { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-gv { animation: lp-wipeY 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; transform-origin: top; }
.slide.active .lp-gh { animation: lp-wipeX 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; transform-origin: left; }
.slide.active .lp-cell:nth-of-type(1) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-cell:nth-of-type(2) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.58s both; }
.slide.active .lp-cell:nth-of-type(3) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.66s both; }
.slide.active .lp-cell:nth-of-type(4) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.74s both; }
.slide.active .lp-cell:nth-of-type(5) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.82s both; }
.slide.active .lp-cell:nth-of-type(6) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.90s both; }
.slide.active .lp-cell:nth-of-type(7) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.98s both; }
.slide.active .lp-cell:nth-of-type(8) { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.06s both; }
.slide.active .lp-footnote,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Member Cities — Federation Wall</div>

            <!-- OPTIONAL branding/logo slot (presenter's mark): wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Halcyon</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- headline -->
            <h1 class="lp-headline absolute left-[96px] top-[164px] m-0 max-w-[1400px] font-display text-[64px] font-bold leading-none tracking-[-0.01em]">Twelve cities run on it</h1>

            <!-- interior grid rules (no outer border) -->
            <div class="lp-gv absolute left-[528px] top-[300px] w-px h-[476px] bg-lp-line"></div>
            <div class="lp-gv absolute left-[960px] top-[300px] w-px h-[476px] bg-lp-line"></div>
            <div class="lp-gv absolute left-[1392px] top-[300px] w-px h-[476px] bg-lp-line"></div>
            <div class="lp-gh absolute left-[96px] right-[96px] top-[538px] h-px bg-lp-line"></div>

            <!-- logo cells: 8 marks, equal 240×96 footprint, monochrome, centered.
                 Swap each placeholder src for the partner's one-color logo, or use a
                 text wordmark cell — every mark is optional/substitutable. -->
            <div class="lp-cell absolute left-[96px] top-[300px] w-[432px] h-[238px] flex items-center justify-center">
                <img class="max-w-[240px] max-h-[96px] object-contain grayscale" src="https://placehold.co/240x96/6f6f6d/f1f0ee" alt="Member city mark 1">
            </div>
            <div class="lp-cell absolute left-[528px] top-[300px] w-[432px] h-[238px] flex items-center justify-center">
                <div class="font-display text-[28px] font-bold tracking-[0.06em] uppercase text-lp-fg">Kota Baru</div>
            </div>
            <div class="lp-cell absolute left-[960px] top-[300px] w-[432px] h-[238px] flex items-center justify-center">
                <img class="max-w-[240px] max-h-[96px] object-contain grayscale" src="https://placehold.co/240x96/5a5a58/f1f0ee" alt="Member city mark 3">
            </div>
            <div class="lp-cell absolute left-[1392px] top-[300px] w-[432px] h-[238px] flex items-center justify-center">
                <img class="max-w-[240px] max-h-[96px] object-contain grayscale" src="https://placehold.co/240x96/7c7c7a/f1f0ee" alt="Member city mark 4">
            </div>
            <div class="lp-cell absolute left-[96px] top-[538px] w-[432px] h-[238px] flex items-center justify-center">
                <img class="max-w-[240px] max-h-[96px] object-contain grayscale" src="https://placehold.co/240x96/64645f/f1f0ee" alt="Member city mark 5">
            </div>
            <div class="lp-cell absolute left-[528px] top-[538px] w-[432px] h-[238px] flex items-center justify-center">
                <img class="max-w-[240px] max-h-[96px] object-contain grayscale" src="https://placehold.co/240x96/525250/f1f0ee" alt="Member city mark 6">
            </div>
            <div class="lp-cell absolute left-[960px] top-[538px] w-[432px] h-[238px] flex items-center justify-center">
                <div class="font-display text-[28px] font-bold tracking-[0.06em] uppercase text-lp-fg">Tirta Raya</div>
            </div>
            <div class="lp-cell absolute left-[1392px] top-[538px] w-[432px] h-[238px] flex items-center justify-center">
                <img class="max-w-[240px] max-h-[96px] object-contain grayscale" src="https://placehold.co/240x96/6a6a68/f1f0ee" alt="Member city mark 8">
            </div>

            <!-- footnote -->
            <div class="lp-footnote absolute left-[96px] top-[836px] font-mono text-[16px] uppercase tracking-[0.14em] text-lp-muted">And <span class="text-lp-accent">14 more</span> across 6 provinces since 2024</div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Active deployments as of Jun 2026 — audited list on request</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">06 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
