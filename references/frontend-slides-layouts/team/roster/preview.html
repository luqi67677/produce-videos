<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster — team layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-riseP { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-col:nth-of-type(1) .lp-crule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.30s both; transform-origin: left; }
.slide.active .lp-col:nth-of-type(2) .lp-crule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both; transform-origin: left; }
.slide.active .lp-col:nth-of-type(3) .lp-crule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; transform-origin: left; }
.slide.active .lp-col:nth-of-type(4) .lp-crule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; transform-origin: left; }
.slide.active .lp-col:nth-of-type(1) .lp-port { animation: lp-riseP 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both; }
.slide.active .lp-col:nth-of-type(2) .lp-port { animation: lp-riseP 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
.slide.active .lp-col:nth-of-type(3) .lp-port { animation: lp-riseP 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.64s both; }
.slide.active .lp-col:nth-of-type(4) .lp-port { animation: lp-riseP 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.76s both; }
.slide.active .lp-col:nth-of-type(1) .lp-id { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-col:nth-of-type(2) .lp-id { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-col:nth-of-type(3) .lp-id { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.05s both; }
.slide.active .lp-col:nth-of-type(4) .lp-id { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">The Team — Core Leadership</div>

            <!-- OPTIONAL branding/logo slot: wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Solstice</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- headline -->
            <h1 class="lp-headline absolute left-[96px] top-[164px] m-0 max-w-[1400px] font-display text-[68px] font-bold leading-none tracking-[-0.01em]">Built by operators</h1>

            <!-- roster columns: 4 × 384px, 64px gutters.
                 Portraits are optional as a set — swap src for real photos or run the no-portrait variant. -->
            <div class="lp-col absolute left-[96px] top-[308px] w-[384px]">
                <div class="lp-crule h-px w-full bg-lp-line"></div>
                <div class="lp-port relative mt-[24px] w-[384px] h-[460px] bg-lp-faint">
                    <img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/384x460/383836/8a8a88" alt="Portrait of Sari Wulandari">
                </div>
                <div class="lp-id">
                    <div class="mt-[28px] font-display text-[32px] font-bold leading-none">Sari Wulandari</div>
                    <div class="mt-[10px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">CEO — ex-telco infra</div>
                </div>
            </div>
            <div class="lp-col absolute left-[544px] top-[308px] w-[384px]">
                <div class="lp-crule h-px w-full bg-lp-line"></div>
                <div class="lp-port relative mt-[24px] w-[384px] h-[460px] bg-lp-faint">
                    <img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/384x460/2e2e2c/7e7e7c" alt="Portrait of Bima Prakoso">
                </div>
                <div class="lp-id">
                    <div class="mt-[28px] font-display text-[32px] font-bold leading-none">Bima Prakoso</div>
                    <div class="mt-[10px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">CTO — 12y computer vision</div>
                </div>
            </div>
            <div class="lp-col absolute left-[992px] top-[308px] w-[384px]">
                <div class="lp-crule h-px w-full bg-lp-line"></div>
                <div class="lp-port relative mt-[24px] w-[384px] h-[460px] bg-lp-faint">
                    <img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/384x460/454543/959593" alt="Portrait of Maya Chen">
                </div>
                <div class="lp-id">
                    <div class="mt-[28px] font-display text-[32px] font-bold leading-none">Maya Chen</div>
                    <div class="mt-[10px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">VP Product — ex-fintech</div>
                </div>
            </div>
            <div class="lp-col absolute left-[1440px] top-[308px] w-[384px]">
                <div class="lp-crule h-px w-full bg-lp-line"></div>
                <div class="lp-port relative mt-[24px] w-[384px] h-[460px] bg-lp-faint">
                    <img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/384x460/323230/828280" alt="Portrait of Rafi Hidayat">
                </div>
                <div class="lp-id">
                    <div class="mt-[28px] font-display text-[32px] font-bold leading-none">Rafi Hidayat</div>
                    <div class="mt-[10px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">VP Sales — gov &amp; enterprise</div>
                </div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Full team of 46 across Jakarta and Singapore</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">10 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
