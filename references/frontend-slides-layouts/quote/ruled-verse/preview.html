<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruled Verse — quote layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-brand,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-qline:nth-child(1) .lp-qrule { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; transform-origin: left; }
.slide.active .lp-qline:nth-child(2) .lp-qrule { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; transform-origin: left; }
.slide.active .lp-qline:nth-child(3) .lp-qrule { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; transform-origin: left; }
.slide.active .lp-qline:nth-child(1) .lp-qtext { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-qline:nth-child(2) .lp-qtext { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.49s both; }
.slide.active .lp-qline:nth-child(3) .lp-qtext { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.63s both; }
.slide.active .lp-attrib { animation: lp-rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- chrome (top) -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Customer Voice — Arka Logistics Pilot</div>

            <!-- OPTIONAL branding/logo slot: wordmark or image logo, ≤40px tall.
                 Image option: <img src="https://placehold.co/260x80" class="h-[40px] w-auto object-contain">
                 Remove this element entirely if the deck carries no brand mark. -->
            <div class="lp-brand absolute right-[96px] top-[66px] h-[40px] flex items-center font-display text-[22px] font-extrabold tracking-[0.08em] uppercase">Arka</div>

            <div class="lp-chrome-rule absolute left-[96px] right-[96px] top-[118px] h-px bg-lp-line"></div>

            <!-- ruled quote block: exactly 3 lines, each standing on its own hairline -->
            <div class="absolute left-[96px] top-[236px] w-[1728px]">
                <blockquote class="m-0 p-0">
                    <div class="lp-qline relative h-[196px]">
                        <span class="lp-qtext absolute left-0 bottom-[44px] font-display text-[104px] font-bold leading-none tracking-[-0.01em]">We stopped arguing</span>
                        <div class="lp-qrule absolute left-0 right-0 bottom-0 h-px bg-lp-line"></div>
                    </div>
                    <div class="lp-qline relative h-[196px]">
                        <span class="lp-qtext absolute left-0 bottom-[44px] font-display text-[104px] font-bold leading-none tracking-[-0.01em]">about screenshots and</span>
                        <div class="lp-qrule absolute left-0 right-0 bottom-0 h-px bg-lp-line"></div>
                    </div>
                    <div class="lp-qline relative h-[196px]">
                        <span class="lp-qtext absolute left-0 bottom-[44px] font-display text-[104px] font-bold leading-none tracking-[-0.01em]">started <em class="not-italic text-lp-accent">shipping decisions.</em></span>
                        <div class="lp-qrule absolute left-0 right-0 bottom-0 h-px bg-lp-line"></div>
                    </div>
                </blockquote>
            </div>

            <!-- attribution signs off right, beneath the last rule -->
            <div class="lp-attrib absolute right-[96px] top-[876px] flex items-center gap-[20px]">
                <span class="w-[12px] h-[12px] bg-lp-accent"></span>
                <span class="font-display text-[30px] font-bold">Dewi Anggraini</span>
                <span class="font-body text-[24px] text-lp-muted">— VP Engineering, Arka Logistics</span>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">Pilot retrospective — recorded 12 Jun 2026</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">07 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
