<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backdrop — video layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #131313;
    --lp-fg: #ececea;
    --lp-fg-muted: #9a9a98;
    --lp-fg-faint: rgba(255, 255, 255, 0.14);
    --lp-accent: #979795;
    --lp-line: rgba(255, 255, 255, 0.30);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(56px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.slide.active .lp-media,
.slide.active .lp-scrim { animation: lp-fade 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-statement .lp-line:nth-child(1) { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-statement .lp-line:nth-child(2) { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
.slide.active .lp-chip { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- video layer (poster state) + scrim.
                 Real decks:
                   <video autoplay muted loop playsinline preload="auto"
                          poster="https://placehold.co/1920x1080">
                 full-bleed, object-cover. Autoplay is allowed ONLY muted.
                 Under prefers-reduced-motion, show the poster instead of playing.
                 This demo shows the poster state; the CSS atmosphere beneath is
                 the load-failure fallback AND the no-video variant. -->
            <div class="lp-media absolute inset-0 bg-[radial-gradient(1500px_900px_at_70%_25%,rgba(255,255,255,0.09),transparent_60%),radial-gradient(1100px_800px_at_10%_80%,rgba(255,255,255,0.05),transparent_55%),linear-gradient(190deg,#242424_0%,#131313_62%)]">
                <img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/1920x1080/232323/606060" alt="Drone pass over the site network — ambient loop poster">
            </div>
            <div class="lp-scrim absolute inset-0 [background:linear-gradient(to_bottom,transparent_44%,rgba(19,19,19,0.94)_82%),rgba(19,19,19,0.45)]" aria-hidden="true"></div>

            <!-- chrome -->
            <div class="lp-kicker absolute left-[96px] top-[72px] z-[2] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">The Network</div>
            <div class="lp-counter absolute right-[96px] top-[72px] z-[2] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">03 / 14</div>

            <!-- statement + chip -->
            <div class="absolute left-[96px] bottom-[120px] z-[2] max-w-[1400px]">
                <h1 class="lp-statement m-0 font-display text-[140px] font-extrabold leading-[0.95] tracking-[-0.02em] uppercase">
                    <span class="lp-line block">Forty sites,</span>
                    <span class="lp-line block">always <em class="not-italic text-lp-accent">on.</em></span>
                </h1>
                <div class="lp-chip inline-flex items-center gap-[16px] mt-[40px] py-[16px] px-[28px] border border-lp-line font-mono text-[15px] font-medium uppercase tracking-[0.14em] text-lp-fg before:content-[''] before:border-l-[12px] before:border-l-lp-accent before:border-y-[8px] before:border-y-transparent">Watch the full film — 03:58</div>
            </div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
