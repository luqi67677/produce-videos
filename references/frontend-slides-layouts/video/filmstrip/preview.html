<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmstrip — video layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #171717;
    --lp-fg: #ebebe9;
    --lp-fg-muted: #979795;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-settle { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-glyph-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-player { animation: lp-settle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-play { animation: lp-glyph-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-caption { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-rail-label { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-row:nth-child(1) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both; }
.slide.active .lp-row:nth-child(2) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.77s both; }
.slide.active .lp-row:nth-child(3) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.89s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- header -->
            <div class="lp-kicker absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Field Footage</div>
            <div class="lp-counter absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">09 / 14</div>
            <h2 class="lp-headline absolute left-[96px] top-[118px] m-0 max-w-[1200px] font-display text-[84px] font-extrabold leading-[1.02] tracking-[-0.02em] uppercase">Three sites on <em class="not-italic text-lp-accent">tape</em></h2>

            <!-- main player: poster + play glyph until a real <video>/<iframe> replaces it.
                 Real decks: <video controls poster="..."> or <iframe allowfullscreen>
                 at this geometry. Poster placeholder: placehold.co/960x540. -->
            <div class="lp-player absolute left-[96px] top-[320px] w-[960px] h-[540px] border border-lp-line overflow-hidden bg-[linear-gradient(150deg,#2a2a2a_0%,#1c1c1c_100%)]">
                <img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/960x540/262626/6a6a68" alt="Jakarta North deployment — poster frame">
                <div class="lp-play absolute left-1/2 top-1/2 w-[88px] h-[88px] mt-[-44px] ml-[-44px] border-[1.5px] border-[rgba(235,235,233,0.9)] rounded-full bg-[rgba(23,23,23,0.35)] after:content-[''] after:absolute after:left-[35px] after:top-[27px] after:border-l-[28px] after:border-l-[rgba(235,235,233,0.9)] after:border-y-[17px] after:border-y-transparent" aria-hidden="true"></div>
            </div>
            <div class="lp-caption absolute left-[96px] top-[884px] font-mono text-[13px] uppercase tracking-[0.14em] text-lp-muted">Jakarta North — 02:56</div>

            <!-- up-next rail (thumb posters: placehold.co/480x270 — 2× of the 240×135 frame) -->
            <div class="lp-rail-label absolute left-[1152px] top-[320px] font-mono text-[14px] font-medium uppercase tracking-[0.2em] text-lp-accent">Up Next</div>
            <div class="absolute left-[1152px] right-[96px] top-[370px]">
                <div class="lp-row relative flex items-center gap-[24px] py-[20px]">
                    <div class="relative flex-none w-[240px] h-[135px] border border-lp-line overflow-hidden bg-[linear-gradient(150deg,#2a2a2a_0%,#1c1c1c_100%)]"><img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/480x270/2b2b2b/6a6a68" alt="Harbor East clip poster"></div>
                    <div>
                        <div class="font-display text-[24px] font-bold text-lp-fg">Harbor East</div>
                        <div class="mt-[8px] font-mono text-[13px] tracking-[0.1em] text-lp-muted">01:42</div>
                    </div>
                </div>
                <div class="lp-row relative flex items-center gap-[24px] py-[20px] before:content-[''] before:absolute before:left-0 before:right-0 before:top-0 before:h-px before:bg-lp-line">
                    <div class="relative flex-none w-[240px] h-[135px] border border-lp-line overflow-hidden bg-[linear-gradient(150deg,#2a2a2a_0%,#1c1c1c_100%)]"><img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/480x270/2b2b2b/6a6a68" alt="Metro Hub clip poster"></div>
                    <div>
                        <div class="font-display text-[24px] font-bold text-lp-fg">Metro Hub</div>
                        <div class="mt-[8px] font-mono text-[13px] tracking-[0.1em] text-lp-muted">02:10</div>
                    </div>
                </div>
                <div class="lp-row relative flex items-center gap-[24px] py-[20px] before:content-[''] before:absolute before:left-0 before:right-0 before:top-0 before:h-px before:bg-lp-line">
                    <div class="relative flex-none w-[240px] h-[135px] border border-lp-line overflow-hidden bg-[linear-gradient(150deg,#2a2a2a_0%,#1c1c1c_100%)]"><img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/480x270/2b2b2b/6a6a68" alt="Airport Apron clip poster"></div>
                    <div>
                        <div class="font-display text-[24px] font-bold text-lp-fg">Airport Apron</div>
                        <div class="mt-[8px] font-mono text-[13px] tracking-[0.1em] text-lp-muted">01:18</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
