<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monolith — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.13);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise-scale { from { opacity: 0; transform: translateY(40px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.slide.active .lp-plumb { animation: lp-draw 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise-scale 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise-scale 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both; }
.slide.active .lp-inscription { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-corner { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- corners -->
            <div class="lp-corner absolute left-[96px] top-[72px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Annual Letter</div>
            <div class="lp-corner absolute right-[96px] top-[72px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">08 Jul 2026</div>
            <div class="lp-corner absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">A. Rahman — Solstice</div>
            <div class="lp-corner absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">01 / 14</div>

            <!-- plumb line (skin point: system's linear device, same axis) -->
            <div class="lp-plumb absolute left-[959px] top-0 w-[2px] h-[210px] origin-top bg-lp-accent" aria-hidden="true"></div>

            <!-- centered title -->
            <div class="absolute left-[96px] right-[96px] top-1/2 translate-y-[-52%] text-center">
                <h1 class="lp-title m-0 font-display text-[200px] font-extrabold leading-[0.95] tracking-[-0.02em] uppercase">
                    <span class="lp-line block">Ten years</span>
                    <span class="lp-line block"><em class="not-italic text-lp-accent">deeper</em></span>
                </h1>
                <p class="lp-inscription mt-[56px] mb-0 font-mono text-[16px] uppercase tracking-[0.35em] text-lp-muted">A letter to the team on the decade ahead</p>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
