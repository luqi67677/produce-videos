<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Half Plate — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-settle { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-plate { animation: lp-settle 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
.slide.active .lp-accent-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
.slide.active .lp-lead { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both; }
.slide.active .lp-caption,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- media plate (left half): swap the placeholder src for the real photo.
                 Recommended image size: 960×1080 (https://placehold.co/960x1080).
                 The frame is fixed and the <img> uses object-cover, so any
                 delivered dimensions fill it without breaking the layout. The
                 gradient beneath is the fallback if the image is missing or fails -->
            <div class="lp-plate absolute left-0 top-0 w-[960px] h-[1080px] overflow-hidden bg-[radial-gradient(1100px_700px_at_25%_20%,rgba(255,255,255,0.35),transparent_60%),radial-gradient(900px_900px_at_85%_85%,rgba(0,0,0,0.28),transparent_55%),linear-gradient(160deg,#cfcecb_0%,#b4b3b0_45%,#8e8d8a_100%)]">
                <img class="absolute inset-0 w-full h-full max-w-none max-h-none object-cover" src="https://placehold.co/960x1080/b7b6b3/76756f" alt="Deployment site photograph">
                <div class="lp-caption absolute left-[48px] bottom-[48px] z-[2] py-[10px] px-[16px] bg-[rgba(242,241,239,0.82)] font-mono text-[13px] uppercase tracking-[0.14em] text-lp-muted">Site 07 — Tanjung Priok, June 2026</div>
            </div>

            <!-- right field -->
            <div class="lp-kicker absolute left-[1056px] top-[96px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Deployment Review</div>
            <div class="absolute left-[1056px] top-[296px] max-w-[720px]">
                <div class="lp-accent-bar w-[72px] h-[8px] mb-[44px] origin-left bg-lp-accent"></div>
                <h1 class="lp-title m-0 font-display text-[120px] font-extrabold leading-[0.97] tracking-[-0.02em] uppercase">
                    <span class="lp-line block">Field</span>
                    <span class="lp-line block"><em class="not-italic text-lp-accent">notes</em></span>
                </h1>
                <p class="lp-lead mt-[36px] mb-0 max-w-[620px] font-body text-[22px] leading-[1.55] text-lp-muted">Six weeks across twelve sites — what held up, what broke, and what the next rollout inherits.</p>
            </div>

            <!-- footer (right half only) -->
            <div class="lp-foot-rule absolute left-[1056px] right-[96px] top-[940px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[1056px] top-[962px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">A. Rahman — Vantage</div>
            <div class="lp-foot-right absolute right-[96px] top-[962px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">01 / 12</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
