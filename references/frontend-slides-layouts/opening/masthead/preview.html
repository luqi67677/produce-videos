<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masthead — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; /* Tailwind CDN injects later; a stray `relative` utility must not win */
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-nameplate { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-rule-thick { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-rule-thin { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
.slide.active .lp-meta-row > *:nth-child(1) { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-meta-row > *:nth-child(2) { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.63s both; }
.slide.active .lp-meta-row > *:nth-child(3) { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.71s both; }
.slide.active .lp-ghost { animation: lp-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-accent-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-lead { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- nameplate -->
            <h1 class="lp-nameplate absolute left-[96px] right-[96px] top-[96px] m-0 font-display text-[170px] font-extrabold leading-[1] tracking-[-0.02em] uppercase whitespace-nowrap">The year <em class="not-italic text-lp-accent">ahead</em></h1>

            <!-- rule pair + meta row (skin point: system's divider vocabulary) -->
            <div class="lp-rule-thick absolute left-[96px] right-[96px] top-[312px] h-[4px] origin-left bg-lp-fg"></div>
            <div class="lp-meta-row absolute left-[96px] right-[96px] top-[344px] flex items-baseline justify-between font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">
                <span class="font-medium tracking-[0.18em] text-lp-accent">Company Briefing</span>
                <span>Volume 04 — Internal</span>
                <span>08 Jul 2026</span>
            </div>
            <div class="lp-rule-thin absolute left-[96px] right-[96px] top-[396px] h-px origin-left bg-lp-line"></div>

            <!-- ghost drop-cap (cropped by bottom edge) -->
            <div class="lp-ghost absolute left-[48px] bottom-[-140px] z-0 pointer-events-none font-display font-extrabold text-[520px] leading-[0.8] text-transparent [-webkit-text-stroke:2px_var(--lp-fg-faint)]" aria-hidden="true">N</div>

            <!-- lead block (bottom-right counterweight) -->
            <div class="absolute right-[96px] bottom-[200px] z-[1] max-w-[640px]">
                <div class="lp-accent-bar w-[48px] h-[6px] mb-[28px] origin-left bg-lp-accent"></div>
                <p class="lp-lead m-0 font-body text-[26px] leading-[1.55] text-lp-muted">Everything we shipped, everything we learned, and the plan we are carrying into next year — laid out in fourteen slides.</p>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[962px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">A. Rahman — Northbeam</div>
            <div class="lp-foot-right absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">01 / 14</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
