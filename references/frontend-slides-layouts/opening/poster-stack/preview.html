<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Stack — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.12);
    --lp-accent: #8a8a88;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-accent-in { from { color: var(--lp-fg); } to { color: var(--lp-accent); } }

.slide.active .lp-row:nth-child(1) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-row:nth-child(2) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.11s both; }
.slide.active .lp-row:nth-child(3) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
.slide.active .lp-row:nth-child(4) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.33s both,
                                                lp-accent-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-kicker,
.slide.active .lp-meta,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- margin chrome -->
            <div class="lp-kicker absolute left-[96px] top-[64px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Annual Briefing</div>
            <div class="lp-meta absolute right-[96px] top-[64px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">08 Jul 2026</div>

            <!-- the stack. Row pattern is fixed: solid / outline / solid / accent.
                 Image variant: the outline row becomes a letterbox image band
                 (object-cover, full row footprint), caption chip at its right -->
            <h1 class="absolute left-[96px] right-[96px] top-[150px]">
                <span class="lp-row block font-display text-[170px] font-extrabold leading-[1.09] tracking-[-0.02em] uppercase text-lp-fg">State</span>
                <span class="lp-row block font-display text-[170px] font-extrabold leading-[1.09] tracking-[-0.02em] uppercase text-transparent [-webkit-text-stroke:2px_rgba(26,26,26,0.55)]">of the</span>
                <span class="lp-row block font-display text-[170px] font-extrabold leading-[1.09] tracking-[-0.02em] uppercase text-lp-fg">platform</span>
                <span class="lp-row block font-display text-[170px] font-extrabold leading-[1.09] tracking-[-0.02em] uppercase text-lp-accent">2026</span>
            </h1>

            <!-- footer -->
            <div class="lp-foot-rule absolute left-[96px] right-[96px] top-[940px] h-px bg-lp-line"></div>
            <div class="lp-foot-left absolute left-[96px] top-[962px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">A. Rahman — Beacon</div>
            <div class="lp-foot-right absolute right-[96px] top-[962px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">01 / 12</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
