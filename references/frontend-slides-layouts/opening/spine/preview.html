<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind (CDN JIT — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- === TOKEN MAPPING (fixed contract — same in every preset) === -->
<script>
tailwind.config = {
    theme: { extend: {
        colors: {
            lp: {
                bg:     'var(--lp-bg)',
                fg:     'var(--lp-fg)',
                muted:  'var(--lp-fg-muted)',
                faint:  'var(--lp-fg-faint)',
                accent: 'var(--lp-accent)',
                line:   'var(--lp-line)',
            },
        },
        fontFamily: {
            display: 'var(--lp-font-display)',
            body:    'var(--lp-font-body)',
            mono:    'var(--lp-font-mono)',
        },
    } },
};
</script>

<style>
/* ===========================================
   1. STAGE MECHANICS (viewport-base.css — raw CSS by design)
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute !important; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   2. TOKEN DEFINITIONS — grayscale demo placeholders.
   Real decks remap every value to the design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.24);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
}

/* ===========================================
   3. CHOREOGRAPHY — keyframes + .slide.active triggers.
   Classes below are animation hooks only; all visual
   styling lives in Tailwind utilities on the markup.
   =========================================== */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
/* rotated label: animate opacity only — a transform animation would
   override its rotate() */
.slide.active .lp-spine-rule { animation: lp-draw 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-monogram { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-spine-label { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-spine-date { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
.slide.active .lp-lead { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-counter { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active bg-lp-bg text-lp-fg">
            <!-- spine column. Image variant: x:0→600 becomes a full-height image
                 strip; the rotated label sits on a scrim chip. The rule at x:600
                 never moves -->
            <div class="lp-spine-rule absolute left-[600px] top-0 w-px h-[1080px] origin-top bg-lp-line"></div>
            <div class="lp-monogram absolute left-0 top-[96px] w-[600px] text-center font-display text-[44px] font-extrabold tracking-[0.04em] text-lp-fg">NF</div>
            <div class="lp-spine-label absolute left-0 top-[540px] w-[600px] text-center rotate-[-90deg] whitespace-nowrap font-mono text-[22px] font-medium uppercase tracking-[0.5em] text-lp-muted">Quarterly Review · Vol 04</div>
            <div class="lp-spine-date absolute left-0 top-[984px] w-[600px] text-center font-mono text-[14px] uppercase tracking-[0.14em] text-lp-muted">08 Jul 2026</div>

            <!-- title field -->
            <div class="lp-kicker absolute left-[696px] top-[180px] font-mono text-[15px] font-medium uppercase tracking-[0.18em] text-lp-accent">Q2 Results &amp; Outlook</div>
            <h1 class="lp-title absolute left-[696px] top-[340px] m-0 max-w-[1030px] font-display text-[140px] font-extrabold leading-[0.97] tracking-[-0.02em] uppercase">
                <span class="lp-line block">The quiet</span>
                <span class="lp-line block"><em class="not-italic text-lp-accent">quarter</em></span>
            </h1>
            <p class="lp-lead absolute left-[696px] top-[660px] m-0 max-w-[640px] font-body text-[22px] leading-[1.55] text-lp-muted">No launches, no incidents, no drama — and the strongest numbers we have ever posted. Here is why boring worked.</p>

            <div class="lp-counter absolute right-[96px] top-[984px] font-mono text-[15px] uppercase tracking-[0.12em] text-lp-muted">01 / 12</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
