interface:
  display_name: "视频生成与编辑"
  short_description: "已安装 V2.6.6｜真实画面优先、镜头衔接与完整语义字幕"
  default_prompt: "使用 $produce-videos 把这份内容制作成动态视频：开工时一次锁定口播、声音、素材、平台、历史参考与人物边界；用真实 0—2 秒钩子建立叙事契约，图解从 34 套主题和 88 套布局中匹配结构，实拍按相关素材取景，不能把真实画面要求退回白底线描道具；把每个剪辑镜头逐一绑定批准口播、真实证据、固定原图 IP 出场职责、已授权的局部嘴眼动画或场景化人物动作和语义切点，以稳定骨架避免等待入场的空白帧；经过完整预览的声画同步、逐镜运动、版式与封面契约审计后，交付成片、独立 3:4 封面及需要时的可编辑时间线。"
