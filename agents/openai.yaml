interface:
  display_name: "视频生成与编辑"
  short_description: "已安装 V2.6.9｜复用确认稿、声音与画面，提前检查易返工处"
  default_prompt: "使用 $produce-videos 把这份内容制作成动态视频：开工先复用确定稿、已授权声音和批准视觉，仅补缺项与变化项；用真实 0—2 秒钩子建立叙事契约，无指定视觉系统时从 34 套主题选择，图解按内容匹配 88 套布局；先写观众看见的动作与结果，再按句子职责选择实景、操作或机制，实拍按相关素材取景，不能把真实画面要求退回白底线描道具或全屏照片轮播；把每个剪辑镜头逐一绑定批准口播、真实证据、固定原图 IP 出场职责、已授权的局部嘴眼动画或场景化人物动作和语义切点，以稳定骨架避免等待入场的空白帧；先检查实际文稿字形、单层字幕与实景接机制的连续样片；预览与母版共用渲染来源。核对真实来源与许可、人物有效像素以及字幕单次坐标换算，区分桌面预览与平台实测；经过完整预览的声画同步、逐镜运动、版式与封面契约审计后，交付成片、独立 3:4 封面及需要时的可编辑时间线。"
